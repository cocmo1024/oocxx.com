<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="OOCXX">
		<title>OOCXX</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #fff;
			}

			body {
				display: grid;
				min-height: 100vh;
				grid-template-rows: 1fr auto;
			}

			main {
				display: grid;
				min-height: 0;
				place-items: center;
				padding: 24px;
			}

			main img {
				display: block;
				width: min(100%, 720px);
				height: auto;
			}

			footer {
				padding: 0 24px 20px;
				color: #8f8f8f;
				font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				text-align: center;
			}

			@media (max-width: 520px) {
				main {
					align-items: start;
					padding: 0;
				}

				main img {
					width: 100%;
					max-width: none;
				}

				footer {
					padding: 18px 16px 24px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/images/wechat-contact.jpg" alt="WeChat contact QR code">
		</main>
		<footer>Copyright oocxx.com. All rights reserved.</footer>
	</body>
</html>
