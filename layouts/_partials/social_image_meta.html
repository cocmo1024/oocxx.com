{{- $images := partial "templates/_funcs/get-page-images" . -}}
{{- with index $images 0 -}}
  {{- $alt := $.Params.social_image_alt | default (printf "%s — %s" ($.Title | default site.Title) site.Title) -}}
<meta property="og:image:alt" content="{{ $alt | plainify | htmlUnescape }}">
<meta name="twitter:image:alt" content="{{ $alt | plainify | htmlUnescape }}">
{{- end -}}
