<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="OOCXX">
		<title>OOCXX</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #fff;
			}

			body {
				display: grid;
				min-height: 100vh;
				place-items: center;
				padding: 24px;
			}

			img {
				display: block;
				width: min(100%, 720px);
				height: auto;
			}

			@media (max-width: 520px) {
				body {
					align-items: start;
					padding: 0;
				}

				img {
					width: 100%;
					max-width: none;
				}
			}
		</style>
	</head>
	<body>
		<img src="/images/wechat-contact.jpg" alt="WeChat contact QR code">
	</body>
</html>
