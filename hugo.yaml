baseURL: "https://oocxx.com/"
locale: "en-US"
defaultContentLanguage: "en"
title: "OOCXX"
theme: "PaperMod"
publishDir: "dist"
staticDir:
  - "public"
enableRobotsTXT: true
enableEmoji: true
summaryLength: 28
disableKinds:
  - RSS
  - taxonomy
  - term

pagination:
  pagerSize: 12

outputs:
  home:
    - HTML
    - JSON

menu:
  main:
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

params:
  env: production
  title: "OOCXX"
  description: "A quiet personal blog about writing, work, tools, and long-term thinking."
  mainSections:
    - posts
  keywords:
    - personal blog
    - writing
    - tools
    - essays
  author: "OOCXX"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: false
  ShowWordCount: false
  ShowLastMod: false
  ShowPageNums: true
  UseHugoToc: true
  disableScrollToTop: false
  hideFooter: true
  hideAuthor: true
  comments: false
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"
  label:
    text: "OOCXX"
  homeInfoParams:
    Title: "Notes worth keeping."
    Content: "Writing about work, tools, attention, and ideas that improve with time."
  editPost:
    disabled: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
