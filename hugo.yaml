baseURL: "https://oocxx.com/"
locale: "en-US"
defaultContentLanguage: "en"
title: "OOCXX"
theme: "PaperMod"
publishDir: "dist"
staticDir:
  - "public"
enableRobotsTXT: false
enableEmoji: true
disableKinds:
  - RSS
  - taxonomy
  - term
  - section
  - sitemap
  - robotsTXT
  - 404

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML

params:
  env: production
  title: "OOCXX"
  description: "OOCXX"
  author: "OOCXX"
  ShowRssButtonInSectionTermList: false
  comments: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
