baseURL: "https://oocxx.com/"
locale: "en-US"
defaultContentLanguage: "en"
title: "OOCXX"
theme: "PaperMod"
publishDir: "dist"
staticDir:
  - "public"
enableRobotsTXT: true
enableEmoji: true
summaryLength: 28
disableKinds:
  - RSS

taxonomies:
  tag: tags
  category: categories
  series: series

pagination:
  pagerSize: 8

related:
  includeNewer: true
  threshold: 20
  toLower: true
  indices:
    - name: series
      weight: 120
    - name: categories
      weight: 100
    - name: tags
      weight: 80
    - name: date
      weight: 10
      pattern: "2006"

outputs:
  home:
    - HTML
    - JSON

menu:
  main:
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: topics
      name: Topics
      url: /tags/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 50

params:
  env: production
  title: "OOCXX"
  description: "A quiet personal blog about writing, work, tools, and long-term thinking."
  mainSections:
    - posts
  keywords:
    - personal blog
    - writing
    - tools
    - essays
  author: "OOCXX"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: false
  ShowWordCount: true
  ShowLastMod: true
  ShowPageNums: true
  UseHugoToc: true
  disableScrollToTop: false
  hideFooter: true
  hideAuthor: false
  comments: false
  ads:
    enabled: true
    show_placeholders: true
    adsense_client: ""
    slots:
      home_feed: ""
      section_feed: ""
      taxonomy_top: ""
      archive_top: ""
      post_top: ""
      post_end: ""
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.svg"
  label:
    text: "OOCXX"
  homeInfoParams:
    Title: "Notes worth keeping."
    Content: "Writing about work, tools, attention, and ideas that improve with time."
  editPost:
    disabled: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
